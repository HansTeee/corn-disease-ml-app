# ---------------------------------------------------------------------------
# LOCAL DEVELOPMENT ONLY.
#
# Runs the API and the UI as two separate containers, the way you would on a
# real platform where each service scales on its own.
#
# Hugging Face Spaces does NOT use this file. Spaces exposes exactly one port
# per Space, so the deployed app uses the single-container Dockerfile, where
# start.sh runs both processes together.
#
#   docker compose up --build
#   UI:       http://localhost:8501
#   API docs: http://localhost:8000/docs
# ---------------------------------------------------------------------------
services:
  api:
    build: .
    image: ml-app
    # Override the image's start.sh: this container runs ONLY the API.
    # 0.0.0.0 here (not 127.0.0.1) because the UI connects from ANOTHER
    # container, over the compose network.
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"   # published only so you can open /docs from your browser
    # The Dockerfile's HEALTHCHECK (GET 127.0.0.1:8000/health) applies here as-is.
    networks: [app-net]

  ui:
    image: ml-app     # same image, different command - no second build needed
    command:
      - streamlit
      - run
      - ui/app.py
      - --server.address=0.0.0.0
      - --server.port=7860
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      # "api" is the service name above. Compose runs a DNS server on the
      # network, so the name resolves to the api container's IP.
      API_URL: http://api:8000
    ports:
      - "8501:7860"
    depends_on:
      api:
        condition: service_healthy   # wait for /health = 200, not just "container started"
    # The image's HEALTHCHECK probes the API on localhost, which isn't in THIS
    # container, so check Streamlit's own health endpoint instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [app-net]

networks:
  app-net: {}
