# CI: runs on every push (any branch) and every pull request.
#
#   lint ──┬── test           (pytest against the real model)
#          └── docker-build   (build the image AND check it becomes healthy)
#
# If ANY job fails, the whole workflow is marked failed. With branch
# protection on main (lint, test and docker-build as required checks), a pull
# request with a red check can't be merged.
name: CI

on:
  push:
  pull_request:

# If you push twice quickly to the same branch, cancel the older run.
# It's testing code that's already out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 3.13 to match the Dockerfile's python:3.13-slim: test with the same
          # Python we ship. (numpy 2.5.4 doesn't support 3.11.)
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Install ONLY ruff, not TensorFlow: linting doesn't need the libraries,
      # so this job finishes in seconds. The version comes from
      # requirements-dev.txt so it matches what you run locally.
      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      # --output-format=github turns each problem into an annotation on the
      # exact line in the PR's "Files changed" view.
      - name: ruff check
        run: ruff check . --output-format=github

  test:
    needs: lint          # no point running slow tests on code that fails lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true      # the model and fixture images are stored in Git LFS

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          # cache: pip saves pip's download cache between runs. Without it,
          # every run downloads TensorFlow (~275 MB) again. The cache key is a
          # hash of these files, so it refreshes when a pin changes.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # --durations=5 prints the slowest tests, so you notice if the suite
      # starts getting slow.
      - name: pytest
        run: pytest -v --durations=5

  docker-build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true      # the image COPYs models/, which lives in LFS

      - uses: docker/setup-buildx-action@v3

      # Build only, never push from CI. type=gha stores Docker's layer cache in
      # GitHub's cache, so the ~2 GB dependency layer is reused when only code
      # changed (the same COPY-requirements-first trick, but across CI runs).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true                 # make the image available to `docker run` below
          tags: ml-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # "It builds" doesn't mean "it starts". Run the container and wait for
      # Docker's HEALTHCHECK (the API's /health) to report healthy. This
      # catches a missing model file, a broken start.sh or an import error,
      # none of which a plain build would notice.
      - name: Smoke test - container becomes healthy
        run: |
          docker run -d --name smoke -p 7860:7860 ml-app:ci
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            echo "health: $status (${i}x2s)"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 2
          done
          docker logs smoke
          test "$status" = "healthy"
          curl -fsS http://localhost:7860/_stcore/health   # Streamlit answers on the public port
