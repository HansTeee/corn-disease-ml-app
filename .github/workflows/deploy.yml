# Deploy: push the code to the Hugging Face Space, which rebuilds and restarts.
#
# WHEN it runs: only after the CI workflow FINISHES for a push to main, and
# only if CI SUCCEEDED. A broken build never reaches production.
#
# WHY workflow_run and not `needs:`: `needs:` only links jobs inside the SAME
# workflow file. This file can't `needs:` a job that lives in ci.yml.
# workflow_run is GitHub's way of saying "start when that other workflow
# completes", and the `if:` on the job below checks that it succeeded.
name: Deploy to Hugging Face Space

on:
  workflow_run:
    workflows: [CI]          # must match `name:` in ci.yml exactly
    types: [completed]
    branches: [main]

# Never run two deploys at once; queue them instead of cancelling, so the
# Space always ends up on the newest commit.
concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # conclusion == success  -> CI passed (failed/cancelled CI = no deploy)
    # event == push          -> a real push to main, not a PR from a fork
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Deploy EXACTLY the commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history. The default (fetch-depth: 1) is a shallow clone, and
          # Hugging Face rejects pushes from a shallow clone.
          fetch-depth: 0
          # Download the real model/image files (not LFS pointer stubs), so
          # they can be uploaded to the Space too.
          lfs: true

      # If two pushes landed close together, a slower, older CI run can finish
      # last. Skip it rather than force-push old code over newer code.
      - name: Skip if a newer commit is on main
        id: latest
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$TESTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved past $TESTED_SHA - a newer run will deploy it"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # SECURITY: the token only ever lives in an environment variable taken
      # from secrets. Nothing here echoes it, and there's no `set -x` (which
      # would print every command, URL included). GitHub also masks secret
      # values in logs as a second line of defence, but don't rely on that.
      - name: Push to Hugging Face Space
        if: steps.latest.outputs.deploy == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}     # e.g. your-username/corn-leaf-classifier
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Set the HF_TOKEN secret and the HF_SPACE variable (see README > CI/CD)"
            exit 1
          fi
          HF_USER="${HF_SPACE%%/*}"   # the part before the "/"
          # A Space is just a git repository. Add it as a remote and push.
          git remote add space "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          # --force: GitHub is the source of truth. The Space's history (e.g.
          # the README it was created with) is overwritten, not merged.
          # HEAD:main: we're on a detached commit; publish it as the Space's main.
          git push --force space HEAD:main
          echo "Pushed. The Space is rebuilding: https://huggingface.co/spaces/${HF_SPACE}"
